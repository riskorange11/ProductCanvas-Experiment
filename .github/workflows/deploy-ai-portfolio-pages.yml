name: Deploy AI Portfolio app to GitHub Pages

# Publishes the static app in ai-portfolio-app/ to GitHub Pages.
# This workflow enables GitHub Pages automatically (configure-pages enablement:true),
# so no manual repo setting is required. It runs on pushes to main or the feature
# branch below, or manually from the Actions tab (workflow_dispatch, available once
# the workflow exists on the default branch).

on:
  push:
    branches:
      - main
      - cursor/ai-portfolio-mobile-app-e48d
    paths:
      - "ai-portfolio-app/**"
      - ".github/workflows/deploy-ai-portfolio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-portfolio-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
