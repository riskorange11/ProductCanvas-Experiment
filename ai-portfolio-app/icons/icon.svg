<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11173a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5b6bff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#6d8bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d8bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- portfolio bars -->
  <g>
    <rect x="120" y="300" width="48" height="92" rx="14" fill="url(#bar)" opacity="0.85"/>
    <rect x="190" y="244" width="48" height="148" rx="14" fill="url(#bar)" opacity="0.92"/>
    <rect x="260" y="196" width="48" height="196" rx="14" fill="url(#bar)"/>
    <rect x="330" y="140" width="48" height="252" rx="14" fill="url(#bar)"/>
  </g>
  <!-- trend line -->
  <polyline points="132,288 212,236 284,188 354,128" fill="none" stroke="#eef2ff" stroke-width="14"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="354" cy="128" r="16" fill="#eef2ff"/>
</svg>
